<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Tile Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)" stroke="#27272a" stroke-width="2" />

  <!-- Ultra-clean Minimalist Monogram 'T' with subtle typographic offset -->
  <!-- Crossbar: Left segment in pure crisp white -->
  <rect x="120" y="148" width="190" height="44" rx="22" fill="#ffffff" />

  <!-- Crossbar: Right accent pill in emerald neon -->
  <rect x="326" y="148" width="66" height="44" rx="22" fill="url(#emeraldGrad)" filter="url(#subtleGlow)" />

  <!-- Vertical Stem of T -->
  <rect x="234" y="210" width="44" height="174" rx="22" fill="url(#stemGrad)" />
</svg>
